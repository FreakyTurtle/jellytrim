name: Bug report
description: Something in JellyTrim does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. If it is a security problem, do not use this form: report it privately from the Security tab instead.

        Before you paste logs or commands, remove your Jellyfin API key, hostnames, IP addresses and personal paths.
  - type: input
    id: jellytrim-version
    attributes:
      label: JellyTrim version
      description: Shown at the bottom of Settings, or run `jellytrim --version`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      placeholder: "12.0.1"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you run JellyTrim
      options:
        - Docker image (ghcr.io/freakyturtle/jellytrim)
        - Release binary
        - Built from source
        - Other (say below)
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and encoder
      description: CPU or GPU, and the encoder in use (from Settings, Hardware).
      placeholder: Intel N100, Intel QSV
  - type: dropdown
    id: dry-run
    attributes:
      label: Was Dry Run on?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what JellyTrim did. Steps to reproduce help a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and technical details
      description: |
        Container logs (`docker logs jellytrim`), or the technical details from the job in History.
        Remove API keys, hostnames and personal paths first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have removed API keys, hostnames and personal paths from this report.
          required: true
        - label: I have searched existing issues for this problem.
          required: true
