name: Feature request
description: Suggest a new feature or a change to how JellyTrim works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Please check the "Not in scope" and "After the MVP" sections of docs/PRODUCT.md first. Something may already be planned, or deliberately left out.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Describe the behaviour you want. If it is a policy, try writing it as a sentence, for example "In Shows, when watched by all users, convert to 720p HEVC."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Library size, hardware, or examples that help explain the need.
